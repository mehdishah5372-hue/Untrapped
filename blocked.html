<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Untrapped — blocked</title>
  <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:12vh auto;padding:24px}code{word-break:break-word}</style>
</head>
<body>
  <h1>Navigation blocked</h1>
  <p>Untrapped blocked this YouTube navigation because it does not match the explicit allowlist policy.</p>
  <p id="reason"></p>
  <script>const r=new URLSearchParams(location.search).get('reason')||'default-deny';document.getElementById('reason').textContent='Reason: '+r;</script>
</body>
</html>
