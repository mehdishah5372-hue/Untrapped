<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untrapped</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body width="1000px">
    <div style="width: 300px; padding: 20px; background-color: orange">
      <div>
        <h1
          align="center"
          style="
            font-weight: bolder;
            text-shadow: 2px 4px 4px rgba(46, 91, 173, 0.6);
          "
        >
          Untrapped
        </h1>
      </div>
      <div style="font-weight: bold">
        <div
          style="
            border: 5px solid white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
          "
        >
          <h6 style="font-weight: bolder; color: purple">Focus Mode</h6>
          <p style="margin-bottom: 10px; font-weight: normal">
            Hide YouTube's distracting feeds, recommendations, Shorts,
            comments, chat, ads, and autoplay while keeping videos usable.
          </p>
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              id="focusMode"
              checked
            />
            <label class="form-check-label" for="focusMode"
              >Focus Mode</label
            >
          </div>
        </div>
      </div>
      <div style="display: flex; justify-content: center; color: black">
        <a
          href="https://github.com/mehdishah5372-hue/Untrapped"
          target="_blank"
          style="
            text-decoration: underline;
            color: black;
            margin-top: 10px;
            font-weight: bolder;
          "
        >
          GitHub
        </a>
      </div>
    </div>
    <script>
      const focusMode = document.getElementById("focusMode");
      chrome.storage.sync.get(["focusMode"], (value) => {
        focusMode.checked = value.focusMode !== false;
      });
      focusMode.addEventListener("change", () => {
        chrome.storage.sync.set({ focusMode: focusMode.checked });
        chrome.tabs.query({ currentWindow: true, active: true }, (tabs) => {
          if (!tabs[0] || !tabs[0].url?.includes("youtube.com")) return;
          chrome.tabs.reload(tabs[0].id);
        });
      });
    </script>
  </body>
</html>
