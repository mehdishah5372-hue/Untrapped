name: UAUD Remote Evidence
on:
  push:
    paths: ['ultra-mode/**','.github/workflows/uaud-remote-evidence.yml']
  pull_request:
    paths: ['ultra-mode/**','.github/workflows/uaud-remote-evidence.yml']
  workflow_dispatch:
jobs:
  observable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run safe remote harness
        shell: pwsh
        run: ./ultra-mode/UAUD-remote-harness.ps1
      - name: Capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uaud-evidence-${{ github.run_id }}
          path: ultra-mode/uaud-evidence/
          if-no-files-found: ignore
          retention-days: 14
