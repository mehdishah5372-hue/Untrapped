name: YouTube exact-allow Windows integration sandbox

on:
  push:
    branches: [youtube-exact-allow-sandbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v4

      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @('./ultra-mode/packet-filter.ps1','./ultra-mode/sandbox-behaviour.ps1') | ForEach-Object {
            $tokens=$null; $errors=$null
            if(-not (Test-Path $_)){ throw "Missing test file: $_" }
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_).Path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count){ throw "Syntax failure: $_" }
          }
          Write-Host 'POWERSHELL SYNTAX PASS'

      - name: Exact URL policy corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content ./youtube-policy.js -Raw
          # Validate the policy with a small PowerShell model equivalent; the
          # authoritative browser rule is tested below by parsing its regex.
          $rules = Get-Content ./youtube-rules.json -Raw | ConvertFrom-Json
          $allow = $rules | Where-Object id -eq 100
          $rx = [regex]$allow.condition.regexFilter
          $allowed = @(
            'https://m.youtube.com/watch?v=2wgg7KtzTrU&vl=en',
            'https://www.youtube.com/watch?vl=en&v=2wgg7KtzTrU&utm_source=x',
            'https://youtube.com/watch?utm_campaign=x&v=2wgg7KtzTrU&t=90'
          )
          $blocked = @(
            'https://www.youtube.com/watch?v=OTHER_VIDEO',
            'https://www.youtube.com/watch?v=2wgg7KtzTrU&v=OTHER_VIDEO',
            'https://www.youtube.com/watch?v=2wgg7KtzTrU&v=2wgg7KtzTrU',
            'https://www.youtube.com/shorts/2wgg7KtzTrU',
            'https://www.youtube.com/results?search_query=2wgg7KtzTrU',
            'https://www.youtube.com/channel/UC123',
            'https://www.youtube.com/@channel',
            'https://youtu.be/2wgg7KtzTrU'
          )
          foreach($u in $allowed){if(-not $rx.IsMatch($u)){throw "ALLOW REGRESSION: $u"}}
          foreach($u in $blocked){if($rx.IsMatch($u)){throw "BLOCK REGRESSION: $u"}}
          Write-Host 'EXACT URL REGRESSION PASS'

      - name: Browser-only OS exclusion test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Normalize-Domains($domains) {
            @($domains | Where-Object { $_ -and $_.ToString() -notmatch '[\s#]' } | ForEach-Object { $_.ToString().ToLowerInvariant().TrimEnd('.') })
          }
          function Get-OsBlockDomains($domains,$browserOnlyDomains) {
            $browser=[System.Collections.Generic.HashSet[string]]::new([string[]](Normalize-Domains $browserOnlyDomains))
            @(Normalize-Domains $domains | Where-Object { -not $browser.Contains([string]$_) })
          }
          $x=@(Get-OsBlockDomains @('youtube.com','chatgpt.com','crushon.ai') @('youtube.com'))
          if($x -contains 'youtube.com'){throw 'YouTube leaked into OS IP policy'}
          if($x -notcontains 'chatgpt.com'){throw 'chatgpt.com unexpectedly excluded'}
          if($x -notcontains 'crushon.ai'){throw 'crushon.ai unexpectedly excluded'}
          Write-Host 'OS POLICY EXCLUSION PASS'

      - name: DNR JSON structural validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Get-Content ./youtube-rules.json -Raw | ConvertFrom-Json
          if(@($rules).Count -ne 3){throw 'Unexpected rule count'}
          if(($rules | Where-Object id -eq 100).priority -le ($rules | Where-Object id -eq 200).priority){throw 'Allow rule priority is not higher'}
          Write-Host 'DNR STRUCTURE PASS'

      - name: Real WinDivert kernel integration smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip="$env:TEMP\WinDivert.zip"
          Invoke-WebRequest -Uri 'https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip' -OutFile $zip
          $expected='c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2'
          $expanded="$env:TEMP\WinDivert"
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          $wd=Get-ChildItem $expanded -Recurse -Filter WinDivert.dll | Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          $sys=Join-Path $wd.Directory.FullName 'WinDivert64.sys'
          if(-not $wd -or -not (Test-Path $sys)){throw 'WinDivert x64 runtime files missing'}
          if((Get-FileHash $wd.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'WinDivert.dll SHA256 mismatch'}
          Copy-Item $wd.FullName ./ultra-mode/WinDivert.dll -Force
          Copy-Item $sys ./ultra-mode/WinDivert64.sys -Force
          $testRoot="$env:TEMP\untrapped-wd-test"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Copy-Item ./ultra-mode/packet-filter.ps1 "$testRoot\packet-filter.ps1"
          Copy-Item ./ultra-mode/WinDivert.dll "$testRoot\WinDivert.dll"
          Copy-Item ./ultra-mode/WinDivert64.sys "$testRoot\WinDivert64.sys"
          # Use an isolated test policy containing a non-YouTube target so the
          # runner's own YouTube exception policy remains intact.
          @'
          {
            "enabled": true,
            "start": "00:00",
            "end": "23:59",
            "domains": ["example.com"],
            "alwaysBlockedDomains": [],
            "alwaysAllowedDomains": [],
            "browserOnlyDomains": ["youtube.com"]
          }
          '@ | Set-Content "$testRoot\config.json" -Encoding UTF8
          $p=Start-Process powershell.exe -ArgumentList '-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',"$testRoot\packet-filter.ps1" -WorkingDirectory $testRoot -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          if($p.HasExited){throw "WinDivert smoke test exited early with code $($p.ExitCode)"}
          $p.Kill()
          Write-Host 'WINDIVERT KERNEL SMOKE PASS: elevated Windows runner opened the modified filter process.'
          Write-Host 'WINDIVERT NOTE: YouTube is intentionally browser-only in this architecture.'

      - name: 1000 real-video exact-allow stress test
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check -q yt-dlp
          $json="$env:TEMP\yt-random-1000.json"
          $queries=@('music','science','math','history','gaming','technology','nature','documentary','cooking','sports')
          $items=@()
          foreach($q in $queries){
            $raw=& python -m yt_dlp --flat-playlist --dump-single-json --playlist-end 100 --no-warnings "ytsearch100:$q" 2>$null
            if($LASTEXITCODE -eq 0 -and $raw){
              try {
                $j=$raw | ConvertFrom-Json
                foreach($e in @($j.entries)){
                  if($e.id -and $e.ie_key -match 'Youtube'){$items += [pscustomobject]@{id=[string]$e.id;query=$q}}
                }
              } catch {}
            }
            if(@($items|Sort-Object id -Unique).Count -ge 1000){break}
          }
          $videos=@($items|Sort-Object id -Unique|Select-Object -First 1000)
          if($videos.Count -lt 1000){throw "Only collected $($videos.Count) real YouTube videos"}
          $videos | ConvertTo-Json -Depth 5 | Set-Content $json -Encoding UTF8
          $chrome=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe","$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe") | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $chrome){throw 'Chrome is not installed.'}
          $root="$env:TEMP\untrapped-stress-$([guid]::NewGuid().ToString('N'))"; New-Item -ItemType Directory -Path $root -Force | Out-Null
          $pass=0;$fail=0;$errors=0;$i=0
          foreach($v in $videos){
            $i++
            if($i % 3 -eq 0){$url="https://m.youtube.com/watch?vl=en&v=$($v.id)&utm_source=stress"}
            elseif($i % 3 -eq 1){$url="https://www.youtube.com/watch?v=$($v.id)&hl=en&utm_campaign=stress"}
            else{$url="https://youtube.com/watch?utm_medium=stress&v=$($v.id)"}
            $out=Join-Path $root "$i.html";$profile=Join-Path $root "p$i"
            try {
              & $chrome --headless=new --disable-gpu --no-first-run --no-default-browser-check --user-data-dir=$profile --load-extension="$PWD" --dump-dom $url *> $out
              $body=if(Test-Path $out){Get-Content $out -Raw}else{''}
              if($body -match 'YouTube is blocked'){$pass++}else{$fail++;Add-Content "$root\FAILURES.txt" ([string]$i+[char]9+[string]$url)}
            } catch {$errors++;Add-Content "$root\ERRORS.txt" ([string]$i+[char]9+[string]$url+[char]9+$_.Exception.Message)}
            if(($i % 100)-eq 0){Write-Host "STRESS $i/1000 blocked=$pass notblocked=$fail errors=$errors"}
          }
          Write-Host "REAL VIDEO STRESS RESULT: total=$($videos.Count) blocked=$pass notblocked=$fail errors=$errors"
          if($fail -ne 0 -or $errors -ne 0){Get-Content "$root\FAILURES.txt" -ErrorAction SilentlyContinue;Get-Content "$root\ERRORS.txt" -ErrorAction SilentlyContinue;throw 'One or more non-allowed real YouTube videos escaped the exact-allow policy.'}
          if($pass -ne 1000){throw "Expected 1000 blocked videos; got $pass"}
          Write-Host '1000/1000 REAL YOUTUBE VIDEOS BLOCKED: exact allowed video remains the only permitted video ID.'

      - name: Browser integration test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $chrome=@(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          ) | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $chrome){throw 'Chrome is not installed on this Windows runner.'}
          $profile="$env:TEMP\untrapped-chrome-$([guid]::NewGuid().ToString('N'))"
          $out="$env:TEMP\untrapped-allowed.html"
          & $chrome --headless=new --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$profile" --load-extension="$PWD" --dump-dom "https://m.youtube.com/watch?v=2wgg7KtzTrU&vl=en" *> $out
          $allowed=Get-Content $out -Raw
          if($allowed -match 'YouTube is blocked'){throw 'Allowed video was blocked by extension'}
          $out2="$env:TEMP\untrapped-blocked.html"
          & $chrome --headless=new --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$profile-blocked" --load-extension="$PWD" --dump-dom "https://www.youtube.com/watch?v=dQw4w9WgXcQ" *> $out2
          $blocked=Get-Content $out2 -Raw
          if($blocked -notmatch 'YouTube is blocked'){throw 'Rickroll video was not blocked'}
          Write-Host 'BROWSER INTEGRATION PASS: permitted video survived; Rickroll was blocked.'
          Write-Host 'The runner tested the extension against live network navigation; YouTube may return consent/availability content for the allowed case, but it must not return the blocker page.'
