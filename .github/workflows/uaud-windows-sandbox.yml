name: UAUD Windows sandbox

on:
  push:
    branches: [main, youtube-exact-allow-sandbox]
  pull_request:
    branches: [main, youtube-exact-allow-sandbox]

permissions:
  contents: read

jobs:
  validate-and-sandbox:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax gate - parse all PowerShell without executing it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          if (-not $files) { throw 'No PowerShell artifacts found.' }
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) {
              Write-Host "SYNTAX FAIL: $($f.FullName)"
              $errors | ForEach-Object { Write-Host "  line=$($_.Extent.StartLineNumber) col=$($_.Extent.StartColumnNumber): $($_.Message)" }
              exit 1
            }
            Write-Host "SYNTAX PASS: $($f.FullName)"
          }

      - name: YouTube JSON and PowerShell policy gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $rules=Get-Content -LiteralPath './youtube-allowlist.json' -Raw | ConvertFrom-Json
          if($rules.version -ne 1){throw 'Bad allowlist version'}
          $entries=@($rules.allowedYouTubeUrls)
          if($entries.Count -lt 1){throw 'Allowlist empty'}
          $ids=@()
          foreach($e in $entries){
            $u=[Uri][string]$e.url
            if($u.Scheme -ne 'https' -or $u.Host -notmatch '^(www\.)?(m\.)?youtube\.com$' -or $u.AbsolutePath -ne '/watch'){throw "Bad allowed URL: $($e.url)"}
            $m=[regex]::Matches($u.Query.TrimStart('?'),'(?:^|&)v=([^&]*)')
            if($m.Count -ne 1 -or $m[0].Groups[1].Value -notmatch '^[A-Za-z0-9_-]{11}$'){throw "Bad video id: $($e.url)"}
            if([string]::IsNullOrWhiteSpace([string]$e.reason)){throw "Missing reason: $($e.url)"}
            $ids+=$m[0].Groups[1].Value
          }
          if($ids -contains 'dQw4w9WgXcQ'){throw 'Rickroll unexpectedly allowlisted'}
          $cases=@(
            @{url='https://m.youtube.com/watch?v=2wgg7KtzTrU&vl=en';allow=$true},
            @{url='https://www.youtube.com/watch?vl=en&v=2wgg7KtzTrU';allow=$true},
            @{url='https://www.youtube.com/watch?v=dQw4w9WgXcQ';allow=$false},
            @{url='https://www.youtube.com/shorts/2wgg7KtzTrU';allow=$false},
            @{url='https://youtu.be/2wgg7KtzTrU';allow=$false},
            @{url='https://www.youtube.com/watch?v=2wgg7KtzTrU&v=dQw4w9WgXcQ';allow=$false}
          )
          foreach($c in $cases){
            $u=[Uri]$c.url;$m=[regex]::Matches($u.Query.TrimStart('?'),'(?:^|&)v=([^&]*)');$ok=$false
            if($u.Scheme -eq 'https' -and $u.Host -match '^(www\.)?(m\.)?youtube\.com$' -and $u.AbsolutePath -eq '/watch' -and $m.Count -eq 1 -and $ids -ccontains $m[0].Groups[1].Value){$ok=$true}
            if($ok -ne $c.allow){throw "Policy mismatch: $($c.url) expected=$($c.allow) actual=$ok"}
          }
          Write-Host "YOUTUBE JSON + POWERSHELL POLICY CONTRACT: PASS ($($entries.Count) allowed URL(s), $($cases.Count) decision cases)"
      - name: Exhaustive PowerShell YouTube policy stress test
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\ultra-mode\youtube-policy-powershell-exhaustive.ps1"
          if($LASTEXITCODE -ne 0){throw "Exhaustive PowerShell policy test failed: $LASTEXITCODE"}

      - name: Pinned baseline reporter contract on Windows VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & (Join-Path $PWD 'ultra-mode/reporter-contract-sandbox.ps1')
          if($LASTEXITCODE -ne 0){throw 'Pinned reporter contract comparison failed'}

      - name: ErrorLibrary persistence gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'ultra-mode'
          . (Join-Path $root 'ErrorLibrary.ps1')
          $old = $ErrorLibraryPath
          $ErrorLibraryPath = Join-Path $env:TEMP ('untrapped-errorlib-' + [guid]::NewGuid().ToString('N') + '.jsonl')
          try {
            $fp = Save-ErrorEvent -Source 'CI' -Stream 'stderr' -Text 'HTTP 422 deterministic rejection' -HttpStatus 422 -Attempt 1 -Artifact 'regression.ps1'
            if (-not $fp) { throw 'ErrorLibrary did not return a fingerprint.' }
            if ((Get-ErrorCount $fp) -ne 1) { throw 'ErrorLibrary did not persist/count the event.' }
            Write-Host "ERRORLIBRARY PASS fingerprint=$fp"
          } finally { Remove-Item $ErrorLibraryPath -Force -ErrorAction SilentlyContinue; $ErrorLibraryPath=$old }

      - name: Baseline vs upgraded executive diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'ultra-mode'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'diagnostic-executive-compare.ps1')
          $rc = $LASTEXITCODE
          Write-Host "Executive diagnostic exit code: $rc"
          if ($rc -ne 0) { throw "Executive baseline comparison failed with exit code $rc" }

      - name: Force-first diagnostic sandbox benchmark
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'ultra-mode'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'diagnostic-force-sandbox.ps1')
          $rc = $LASTEXITCODE
          Write-Host "Diagnostic sandbox exit code: $rc"
          if ($rc -ne 0) { throw "Force-first diagnostic sandbox failed with exit code $rc" }

      - name: UAUD validator gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'ultra-mode'
          $candidate = Join-Path $env:TEMP 'uaud-validator-test.ps1'
          Set-Content -LiteralPath $candidate -Value 'Write-Host "validator test"' -Encoding UTF8
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'UAUD-validate.ps1') -Candidate $candidate -Artifact 'regression-test.ps1' 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "UAUD validator failed with exit code $LASTEXITCODE" }

      - name: Behavioural sandbox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'ultra-mode\sandbox-behaviour.ps1') -ScriptPath (Join-Path $PWD 'ultra-mode\packet-filter.ps1') -ConfigPath (Join-Path $PWD 'ultra-mode\config.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full UAUD launch-chain gate
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'ultra-mode'
          Write-Host '=== FULL UAUD CHAIN TEST ==='
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'UAUD.ps1')
          $rc = $LASTEXITCODE
          Write-Host "UAUD exit code: $rc"
          if ($rc -ne 0) { throw "Full UAUD launch chain failed with exit code $rc" }

      - name: Verify protected boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $s = Get-Content -Raw -LiteralPath (Join-Path $PWD 'ultra-mode\packet-filter.ps1')
          if ($s -match '(?i)Set-NetFirewall|New-NetFirewall|Remove-NetFirewall|netsh\s+advfirewall|Set-ItemProperty.*Hosts|route\s+(add|delete)|netsh\s+interface\s+ip\s+set\s+dns') {
            throw 'Protected-boundary regression detected in packet-filter.ps1.'
          }
          Write-Host 'PROTECTED BOUNDARY PASS.'
