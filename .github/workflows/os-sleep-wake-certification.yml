name: OSblocker Windows sleep-wake certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sleep-wake:
    # Required: a disposable self-hosted Windows VM registered with this label.
    # Never run this job on windows-latest: suspending a hosted runner can destroy CI control-plane state.
    runs-on: [self-hosted, windows, osblocker-cert-vm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run genuine suspend/resume gate
        shell: powershell
        run: '& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$PWD\ultra-mode\os-sleep-wake-certification.ps1"'
      - name: Upload sleep/wake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osblocker-sleep-wake-${{ github.run_id }}
          path: ultra-mode/os-sleep-wake-report.json
          if-no-files-found: warn
